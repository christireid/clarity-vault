<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13113a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#a5b4fc" stroke-opacity="0.07" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="950" cy="60" rx="420" ry="230" fill="url(#glow)"/>
  <ellipse cx="180" cy="320" rx="380" ry="200" fill="url(#glow)"/>

  <!-- decorative code chips (right side) -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
    <rect x="820" y="84" rx="10" width="290" height="40" fill="#312e81" fill-opacity="0.55" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="838" y="109" fill="#c7d2fe">Summarize <tspan fill="#f0abfc">{{article}}</tspan> for <tspan fill="#f0abfc">{{tone}}</tspan></text>

    <rect x="860" y="140" rx="10" width="250" height="40" fill="#312e81" fill-opacity="0.55" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="878" y="165" fill="#c7d2fe">v3 <tspan fill="#818cf8">→</tspan> main <tspan fill="#4ade80">✓ eval 98%</tspan></text>

    <rect x="838" y="196" rx="10" width="272" height="40" fill="#312e81" fill-opacity="0.55" stroke="#6366f1" stroke-opacity="0.5"/>
    <text x="856" y="221" fill="#c7d2fe">compare: <tspan fill="#a5b4fc">claude · gpt · llama</tspan></text>
  </g>

  <!-- logo tile -->
  <rect x="88" y="96" width="64" height="64" rx="16" fill="url(#tile)"/>
  <rect x="88" y="96" width="64" height="64" rx="16" stroke="#a5b4fc" stroke-opacity="0.4"/>
  <text x="120" y="141" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" fill="#ffffff">P</text>

  <!-- wordmark -->
  <text x="170" y="144" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="52" font-weight="800" fill="#ffffff">Prompt <tspan fill="url(#accent)">Vault</tspan></text>

  <!-- tagline -->
  <text x="90" y="196" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="21" fill="#c7d2fe">The open LLMOps workspace — version, test, evaluate &amp; ship your AI prompts.</text>

  <!-- feature pills -->
  <g font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="90" y="222" rx="15" width="150" height="30" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="165" y="242" text-anchor="middle" fill="#e0e7ff">⎇ Versioning</text>
    <rect x="252" y="222" rx="15" width="150" height="30" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="327" y="242" text-anchor="middle" fill="#e0e7ff">▶ Playground</text>
    <rect x="414" y="222" rx="15" width="150" height="30" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="489" y="242" text-anchor="middle" fill="#e0e7ff">✓ Evaluations</text>
    <rect x="576" y="222" rx="15" width="150" height="30" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.6"/>
    <text x="651" y="242" text-anchor="middle" fill="#e0e7ff">≣ Analytics</text>
  </g>
</svg>
